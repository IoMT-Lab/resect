# Resect development stack.
#
#   renode       - Renode emulation environment
#   ollama       — LLM inference + embeddings server (HTTP)
#   ollama-init  — one-shot: pulls the shipped models into the persistent volume
#

services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    profiles: [init, normal]
    volumes: [ollama-models:/root/.ollama]
    environment:
      # Bind all interfaces so the resect + ollama-init containers can reach it
      # by service name over the Compose network.
      OLLAMA_HOST: 0.0.0.0:11434
    healthcheck:
      test: ["CMD", "ollama", "list"]
      # Probe fast only while starting (start_interval, Docker 25+), then back
      # off to every 30s so the logs aren't spammed with a heartbeat. The CLI
      # logs HEAD / + GET /api/tags on the server each probe.
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
      start_interval: 3s

  ollama-init:
    # Pulls the shipped inference + embedding models into the ollama-models
    # volume, then exits. Idempotent: already-present models report "up to date"
    # and this returns immediately on warm boots.
    image: ollama/ollama:latest
    restart: no
    profiles: [init]
    environment:
      OLLAMA_HOST: ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        echo "Pulling inference model: ${RESECT_LLM_MODEL:-gemma4:e4b}"
        ollama pull "${RESECT_LLM_MODEL:-gemma4:e4b}"
        echo "Pulling embedding model: nomic-embed-text"
        ollama pull nomic-embed-text
        echo "Model pull complete."

  renode:
    image: nexus.medmakers.io/docker/renode:latest
    restart: unless-stopped
    profiles: [normal]
    environment:
      RENODE_COMMS_HOST: "resect"

  resect:
    image: nexus.medmakers.io/docker/resect:latest
    restart: no
    profiles: [normal]
    init: true
    build:
      context: .
      dockerfile: docker/Dockerfile
    working_dir: /workdir
    volumes:
      - resect-state:/static_home
      - ./workdir:/workdir
      # Mount native Wayland socket directly to matching path inside container
      - ${XDG_RUNTIME_DIR}/${WAYLAND_DISPLAY}:${XDG_RUNTIME_DIR}/${WAYLAND_DISPLAY}

      # Mount X11 socket for XWayland fallback
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
    env_file:
      - ${INTERNAL_ENV_FILE}

    depends_on:
      renode:
        condition: service_started
      ollama:
        condition: service_healthy
    ports: [5900:5900] # VNC server for GUI

  cache-cleaner:
    image: busybox:latest
    restart: no
    profiles: [_]
    volumes: [resect-state:/static_home]
    entrypoint: /bin/sh
    command: -c "rm -rf /static_home/*"

volumes:
  ollama-models: # LLM model store (large; re-pullable)
  resect-state: # Persistent state for the resect container

