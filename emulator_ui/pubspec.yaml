name: emulator_ui
description: Flutter desktop UI for ARM firmware emulation
publish_to: 'none'
version: 0.2.0

environment:
  sdk: ^3.9.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.10
  graphview: ^1.2.0
  file_selector: ^1.0.3
  window_manager: ^0.3.7
  cupertino_icons: ^1.0.6
  sqlite3_flutter_libs: ^0.5.0
  path: ^1.9.0
  emulator_orchestrator:
    path: ../emulator_orchestrator
  resect_callgraph:
    hosted: https://nexus.medmakers.io/repository/pub
    version: ^1.0.0

dev_dependencies:
  # Test-only: in-memory ArtifactDatabase for the auto-tune parity test.
  drift: ^2.15.0
  flutter_test:
    sdk: flutter
  iomt_lab_lints:
    hosted: https://nexus.medmakers.io/repository/pub
    version: ^1.0.0

flutter:
  uses-material-design: true
